<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT FORM</title>
</head>
<body>
    <FORM>
        <P >
            <Fieldset>
                <H1 >
                    Contact Form
                </H1>
                <h4>
                   <I>Please fill all the text in the field</I>
                </h4>
            </Fieldset>
        </P>
        <p>
            <h2>
                Personal Information
            </h2>
        </p>
        <p>
        Name:<input type="name" name="name" id="name" placeholder="Your full name">
        </p>
        <p>
        Father Name: <input type="name" name="father name" id="father" placeholder=" Your father's name">
        </p>
        <p>
        Qualification:        
        </p>
        <p>
            <select name="education" id="education" REQUIRED>
                <option value="">--select your qualification--</option>
                <option value="Matric "> Matric</option>
                <option value="Intermediate "> Intermediate</option>
                <option value="Graduation">Graduation</option>
            </select> 
        </p>
        <hr>
        <p>
            Gender:
        </p>
        <p>
            Male<input type="radio" name="gender" id="Male">
        </p>
        <P>
           Female <input type="radio" name="gender" id="Female">
        </P>
        <p>
           Contact no: <input type="number" name="number" id="number" placeholder="Enter Your Number"> 
        </p>
        <P>
            Message: <textarea name="message" id="message" cols="30" rows="10" placeholder="Your opinion to give"></textarea>
        </P>
        <input type="submit" value="SUBMIT">
        <input type="submit" value="RESET">

    </FORM>
    
</body>
</html>
