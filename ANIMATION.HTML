<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation </title>
    <style>
    .circle{
        height: 200px;
        width: 200px;
        background-color: blueviolet;
        color: aliceblue;
        transition: width 2s,height 2s,border-radius 2s,text 2s;

    }
    .circle:hover{
        width: 300px;
        height: 300px;
        color: black;
        background-color: blue;
        border-radius: 50%;
        text-align: center;
    }
   
    

    

    </style>
</head>
<body>
<div class="circle">
    square
</div>
</body>
</html>
