<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Job Application</title>
    <link rel="stylesheet" href="project02.css">
</head>

<body>
  <div class="container">
    <div class="heading">
        <h1><b>Job Application</b></h1>
    </div>
    <form class="fcontainer">
        <div class="inputbox">
        <label >First Name:</label><input type="text" placeholder="First Name">
        </div>

        <div class="inputbox">
            <label>Second Name: </label><input type="text" placeholder="Second Name">
        </div>

        <div class="inputbox">
            <label>Email:</label> <input type="email" placeholder="Fill123@gmail.com">
        </div>
        <div class="inputbox" >
            <label>Job role:</label>
            <select>
                <option >Select Your Role</option>
                <option value="Web Developement">Web Developement</option>
                <option value="Full Stack Developement">Full Stack Developement</option>
                <option value="Frontend Developer">Frontend Developer</option>
                <option value="Backend Developer">Backend Developer</option>
            </select>    
        </div>
        <div class="inputbox">
           <label> Address:</label> <textarea placeholder="Enter Your Address" rows="4" cols="50"></textarea>
        </div>
        <div class="inputbox">
           <label> City:</label> <input type="text" placeholder="Enter Your City">
        </div>
        <div class="inputbox">
            <label>Password:</label> <input type="password" placeholder="Password">
        </div>
        <div class="inputbox">
        <label>Start Date:</label><input placeholder="01-01-2024" type="date">
        </div>
        <div class="inputbox">
       <label> Choose Your CV: </label> <input class="file" type="file" >
        </div>
       <div class="btn"><button type="submit">Apply Now</button></div>
    </form>
</div>

</body>
</html>
